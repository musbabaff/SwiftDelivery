# ===================================================================
# SwiftDelivery — CI/CD Build Pipeline
# ===================================================================
#
# This workflow builds the SwiftDelivery plugin on every push and
# pull request to the main branch. It compiles the project with
# Maven, runs tests, and uploads the compiled JAR as an artifact.
#
# ===================================================================

name: Build SwiftDelivery

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package --batch-mode --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDelivery
          path: target/SwiftDelivery-*.jar
          retention-days: 30

  # ── Automatic Release ──────────────────────────
  # Creates a GitHub Release when a version tag is pushed
  # Usage: git tag v1.0.0 && git push --tags
  #
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build release JAR
        run: mvn clean package --batch-mode --no-transfer-progress -DskipTests

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.version.outputs.VERSION }} — SwiftDelivery"
          body: |
            ## SwiftDelivery ${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download `SwiftDelivery-*.jar` below
            2. Place in your server's `plugins/` folder
            3. Restart your server

            ### Requirements
            - Java 17+
            - Spigot/Paper 1.16.5 – 1.21.4

            ---
            *Built automatically by GitHub Actions*
          files: target/SwiftDelivery-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
