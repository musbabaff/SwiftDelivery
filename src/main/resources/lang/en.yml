# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  EVENT MESSAGES                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

event:
  # Event start broadcast
  start:
    broadcast: "&a{delivery} &7has started! &eRequired: &f{item}"
    title: "&a&l{delivery}"
    subtitle: "&7Required: &e{item}"
  
  # Event end broadcast
  end:
    broadcast: "&c{delivery} &7has ended!"
    winners_header: "&6Winners:"
    winner_format: "  {color}{rank}. &f{player} &8- &e{count} &7deliveries"
    no_winners: "&7  No winners - nobody delivered."
    title: "&c&lEVENT ENDED!"
    subtitle: "&7{delivery}"
  
  # Active event info
  active:
    info: "&7Active: &f{delivery}"
    item: "&7Item: &e{item}"
    category: "&7Category: &f{category}"
    remaining: "&7Remaining: &f{time}"
    participants: "&7Participants: &f{count}"
  
  # No active event
  none:
    message: "&7No active delivery event at the moment."
    tip: "&7Check back later or wait for scheduled events."

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  DELIVERY MESSAGES                                                          │
# └─────────────────────────────────────────────────────────────────────────────┘

delivery:
  # Successful delivery
  success:
    title: "&a&lDELIVERED!"
    subtitle: "&e{amount} &7x &f{item}"
    message: "&a{amount} &7x &e{item} &7delivered!"
    stats: "&7Total: &f{total} &8| &7Rank: &e#{rank}"
  
  # Delivery from chest
  chest:
    prompt: "&aRight-click a chest! &7(10 seconds)"
    success: "&a{amount} &7x &e{item} &7delivered from chest!"
    not_chest: "&cThis is not a chest!"
    empty: "&cNo &e{item} &cfound in this chest!"
    timeout: "&cChest selection timed out."
  
  # Delivery from inventory
  inventory:
    empty: "&cNo &e{item} &cin your inventory!"
  
  # Errors
  error:
    no_active: "&cNo active delivery event!"
    invalid_item: "&cInvalid item: &f{item}"
    not_started: "&cThis delivery hasn't started yet!"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  REWARD MESSAGES                                                            │
# └─────────────────────────────────────────────────────────────────────────────┘

reward:
  # Reward received
  received:
    item: "&a&l✦ REWARD &r&7Received &f{amount}x {item}&7!"
    command: "&a&l✦ REWARD &r&7Reward command executed!"
    both: "&a&l✦ REWARD &r&7Received &f{amount}x {item} &7+ bonus!"
  
  # Pending rewards
  pending:
    has_pending: "&eYou have pending rewards! They will be delivered shortly."
    delivered: "&aYour pending rewards have been delivered!"
    none: "&7You have no pending rewards."
  
  # Inventory full
  inventory_full: "&eInventory full! Reward saved for later."

