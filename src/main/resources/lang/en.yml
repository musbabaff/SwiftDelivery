# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# ═══════════════════════════════════════════════════════════════════════════════
# COLOR CODES
# ═══════════════════════════════════════════════════════════════════════════════
#   &0 Black       &1 Dark Blue    &2 Dark Green   &3 Dark Aqua
#   &4 Dark Red    &5 Dark Purple  &6 Gold         &7 Gray
#   &8 Dark Gray   &9 Blue         &a Green        &b Aqua
#   &c Red         &d Light Purple &e Yellow       &f White
#   &l Bold        &o Italic       &n Underline    &m Strikethrough
#   &k Magic       &r Reset
#
# ═══════════════════════════════════════════════════════════════════════════════
# PLACEHOLDERS
# ═══════════════════════════════════════════════════════════════════════════════
#   {player}          - Player name
#   {player_uuid}     - Player UUID
#   {category}        - Category name
#   {item}            - Item name
#   {delivery_name}   - Delivery event name
#   {amount}          - Amount/Count
#   {rank}            - Player rank in leaderboard
#   {total}           - Total deliveries
#   {start_time}      - Event start time
#   {end_time}        - Event end time
#   {remaining_time}  - Time remaining
#   {timezone}        - Server timezone
#   {winner_count}    - Number of winners
#   {winners}         - Winners list
#   {error}           - Error message
#
# ═══════════════════════════════════════════════════════════════════════════════

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  GENERAL SETTINGS                                                           │
# └─────────────────────────────────────────────────────────────────────────────┘

general:
  # Plugin prefix - appears before all messages
  prefix: "&e&lV&6elo&e&lD&6elivery &8»"
  
  # Permission denied message
  no_permission: "&cYou don't have permission to use this command."
  
  # Console trying to use player-only command
  player_only: "&cThis command can only be used by players."
  
  # Unknown subcommand
  unknown_command: "&cUnknown command: &f{command}"
  unknown_command_tip: "&7Use &e/dc help &7for available commands."
  
  # Console sender name
  console_name: "Console"
  
  # Plugin enabled/disabled
  enabled: "&aVeloDelivery has been enabled!"
  disabled: "&cVeloDelivery has been disabled!"

