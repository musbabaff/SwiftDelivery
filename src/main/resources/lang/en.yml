  config_load: "&cConfiguration error: &f{error}"
  event_start: "&cFailed to start event: &f{error}"
  event_end: "&cFailed to end event: &f{error}"
  reward_give: "&cFailed to give reward: &f{error}"
  webhook_send: "&cWebhook error: &f{error}"
  invalid_player: "&cInvalid player: &f{player}"
  database: "&cA database error occurred."
  internal: "&cAn internal error occurred."

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  VALIDATION MESSAGES                                                        │
# └─────────────────────────────────────────────────────────────────────────────┘

validation:
  missing_field: "Missing required field: {field}"
  invalid_value: "Invalid value for {field}: {value}"
  invalid_category: "Category not found: {category}"
  invalid_item: "Invalid item: {item}"
  invalid_timezone: "Invalid timezone: {timezone}"
  invalid_schedule: "Invalid schedule: {expression}"
  empty_category: "Category has no items: {category}"
  duplicate_delivery: "Duplicate delivery name: {name}"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  WEBHOOK MESSAGES                                                           │
# └─────────────────────────────────────────────────────────────────────────────┘

webhook:
  # Event start notification
  start:
    title: "📦 {delivery} Started!"
    description: "A new delivery event has started!\n\n**🎯 Required Item:**\n`{item}`\n\n**📁 Category:** {category}\n**⏱️ Duration:** {duration}\n**🏆 Winners:** {winners} players\n\n*Join the server and start delivering!*"
    color: 65280  # Green (#00FF00)
    footer: "VeloDelivery • Delivery Event System"
  
  # Event end notification
  end:
    title: "🏆 {delivery} Ended!"
    description: "The delivery event has ended!\n\n**📦 Delivered Item:** `{item}`\n**📁 Category:** {category}\n**👥 Participants:** {participants} players\n**📊 Total Deliveries:** {total} items"
    color: 16766720  # Gold (#FFD700)
    footer: "VeloDelivery • Delivery Event System"
    winners_title: "🎖️ Winners"
    winner_format: "{medal} **{player}** - {count} deliveries"
    no_winners: "*No participants*"
  
  # Medal symbols
  medals:
    first: "🥇"
    second: "🥈"
    third: "🥉"
    other: "🏅"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  TIME FORMATS                                                               │
# └─────────────────────────────────────────────────────────────────────────────┘

time:
  day: "{count} day"
  days: "{count} days"
  hour: "{count} hour"
  hours: "{count} hours"
  minute: "{count} minute"
  minutes: "{count} minutes"
  second: "{count} second"
  seconds: "{count} seconds"
  now: "Now"
  and: "and"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  MEDAL SYMBOLS                                                              │
# └─────────────────────────────────────────────────────────────────────────────┘

medals:
  first: "&6&l①"
  second: "&f&l②"
  third: "&c&l③"
  other: "&7{rank}."

