    leaderboard: "&bLeaderboard"
    leaderboard_lore: "&7See top deliverers"
    help: "&fHelp"
    help_lore: "&7Learn about the system"
  
  # Delivery detail menu
  detail:
    title: "Delivery: {name}"
    info: "&e{name}"
    required_item: "&7Required Item"
    category: "&7Category: &f{category}"
    total_deliveries: "&7Total Deliveries: &e{count}"
    your_deliveries: "&7Your Deliveries: &a{count}"
    your_rank: "&7Your Rank: &e#{rank}"
    deliver_inventory: "&aDeliver from Inventory"
    deliver_inventory_lore: "&7Deliver all {item} from your inventory"
    deliver_chest: "&6Deliver from Chest"
    deliver_chest_lore: "&7Right-click a chest to deliver"
    deliver_chest_time: "&e10 seconds to select"
    back: "&cBack"
    back_lore: "&7Return to main menu"
  
  # Leaderboard menu
  leaderboard:
    title: "Leaderboard"
    no_active: "&7No Active Event"
    no_active_lore: "&8Waiting for delivery event"
    entry: "{color}#{rank} {player}"
    entry_lore: "&7Deliveries: &e{count}"
    back: "&cBack"
    back_lore: "&7Return to main menu"
  
  # Waiting delivery
  waiting:
    status: "&8Waiting"
    start_time: "&7Starts: &e{time}"
    not_started: "&8Not started yet"

# ┌─────────────────────────────────────────────────────────────────────────────┐
