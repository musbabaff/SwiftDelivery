    broadcast: "&a{delivery} &7başladı! &eİstenen: &f{item}"
    title: "&a&l{delivery}"
    subtitle: "&7İstenen: &e{item}"
  
  # Etkinlik bitiş duyurusu
  end:
    broadcast: "&c{delivery} &7sona erdi!"
    winners_header: "&6Kazananlar:"
    winner_format: "  {color}{rank}. &f{player} &8- &e{count} &7teslimat"
    no_winners: "&7  Kazanan yok - kimse teslim etmedi."
    title: "&c&lETKİNLİK BİTTİ!"
