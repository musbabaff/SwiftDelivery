    category: "&7Kategori: &f{category}"
    remaining: "&7Kalan: &f{time}"
    participants: "&7Katılımcı: &f{count}"
  
  # Aktif etkinlik yok
  none:
    message: "&7Şu an aktif teslimat etkinliği yok."
    tip: "&7Zamanlanmış etkinlikleri bekleyin."

