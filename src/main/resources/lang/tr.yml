# ═══════════════════════════════════════════════════════════════════════════════
# PLACEHOLDER'LAR
# ═══════════════════════════════════════════════════════════════════════════════
#   {player}          - Oyuncu adı
#   {player_uuid}     - Oyuncu UUID
#   {category}        - Kategori adı
#   {item}            - Eşya adı
#   {delivery_name}   - Teslimat etkinlik adı
#   {amount}          - Miktar/Sayı
#   {rank}            - Sıralama
#   {total}           - Toplam teslimat
#   {start_time}      - Başlangıç zamanı
