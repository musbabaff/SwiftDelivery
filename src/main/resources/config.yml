# ┌─────────────────────────────────────────────────────────────────────────────┐
# │                                                                             │
# │                     SwiftDelivery — Configuration                           │
# │               Premium Delivery Event System by NettyForge                   │
# │                            Version: 1.0.0                                   │
# │                                                                             │
# │  Documentation: https://github.com/musbabaff/SwiftDelivery/wiki             │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

# ┌───────────────────────────────────────────────┐
# │  GENERAL SETTINGS                              │
# └───────────────────────────────────────────────┘

general:

  # Language file to use (from locales/ folder)
  # Available: en, tr, de, es, fr, pt, ru, zh
  language: en

  # Timezone for event scheduling
  # See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: America/Los_Angeles

  # Enable debug mode for verbose console logging
  # Only enable this when troubleshooting issues
  debug: false

# ┌───────────────────────────────────────────────┐
# │  CATEGORY DISPLAY NAMES                       │
# │                                               │
# │  Custom names shown in the GUI for each       │
# │  item category. Must match keys in            │
# │  categories.yml.                              │
# └───────────────────────────────────────────────┘

category-display-names:
  farm: "Farm"
  ore: "Ore"
  block: "Block"
  food: "Food"
  wood: "Wood"
  rare: "Rare"
  nether: "Nether"
  end: "End"
  mob: "Mob Drop"
  dye: "Dye"
  tool: "Tool"
  armor: "Armor"
  weapon: "Weapon"
  potion: "Potion"
  decoration: "Decoration"
  redstone: "Redstone"
  misc: "Miscellaneous"

# ┌───────────────────────────────────────────────┐
# │  DELIVERY DISPLAY NAMES                       │
# │                                               │
# │  Custom names for delivery events shown in    │
# │  menus, broadcasts, and webhooks.             │
# │  Must match keys in deliveries.yml.           │
# └───────────────────────────────────────────────┘

delivery-display-names:
  daily: "Daily Delivery"
  mining: "Mining Delivery"
  blocks: "Block Delivery"
  diamond: "Diamond Delivery"
  farming: "Farming Delivery"
  grand-event: "Grand Event"

# ┌───────────────────────────────────────────────┐
# │  EVENT SETTINGS                               │
# │                                               │
# │  Global settings that apply to all delivery   │
# │  events unless overridden per-delivery.       │
# └───────────────────────────────────────────────┘

events:

  # Maximum number of simultaneously active events
  max-concurrent: 5

  # Server-wide announcements
  announcements:
    start: true            # Broadcast when an event starts
    end: true              # Broadcast when an event ends

  # Sound effects played to all online players
  sounds:
    enabled: true
    start: "ENTITY_PLAYER_LEVELUP"
    end: "UI_TOAST_CHALLENGE_COMPLETE"

  # Title screen overlay shown to all online players
  title:
    enabled: true
    fade-in: 10            # Ticks (20 ticks = 1 second)
    stay: 70
    fade-out: 20

# ┌───────────────────────────────────────────────┐
# │  DISCORD WEBHOOK                              │
# │                                               │
# │  Sends rich embed notifications to Discord    │
# │  when delivery events start and end.          │
# │                                               │
# │  How to get a Webhook URL:                    │
# │  1. Choose a channel in your Discord server   │
# │  2. Channel Settings > Integrations > Webhooks│
# │  3. Create "New Webhook" and copy the URL     │
# └───────────────────────────────────────────────┘

webhook:

  # Master switch — enable/disable all webhook notifications
  enabled: false

  # Discord Webhook URL
  # Paste your full Discord webhook URL here
  url: "YOUR_WEBHOOK_URL_HERE"

  # Include @everyone mention in webhook messages
  # Warning: This can be spammy! Use with caution.
  mention-everyone: false

  # ── Event Start Embed ──────────────────────────
  #
  # Placeholders:
  #   {delivery}  — Delivery event name
  #   {item}      — Required item name
  #   {category}  — Category name
  #   {duration}  — Event duration
  #   {winners}   — Number of winner slots
  #   {end_time}  — When the event ends
  #
  start:
    title: "📦 {delivery} Started!"
    description: "A new delivery event has begun!\\n\\n**📋 Item to Deliver:**\\n`{item}`\\n\\n**📂 Category:** {category}\\n**⏰ Duration:** {duration}\\n**🏆 Winners:** {winners} players\\n\\n*Join the server and start delivering!*"
    color: "#00FF00"
    footer: "SwiftDelivery | Delivery Event System"
    thumbnail: ""
    author:
      name: "SwiftDelivery"
      icon: ""
    fields:
      - name: "How to Participate?"
        value: "Join the server and use `/delivery` to open the menu!"
        inline: false

  # ── Event End Embed ────────────────────────────
  #
  # Placeholders:
  #   {delivery}      — Delivery event name
  #   {item}          — Delivered item name
  #   {category}      — Category name
  #   {total}         — Total items delivered
  #   {participants}  — Number of participants
  #   {winners}       — Formatted winners list
  #
  end:
    title: "🏆 {delivery} Ended!"
    description: "The delivery event is complete!\\n\\n**📦 Delivered:** `{item}`\\n**📂 Category:** {category}\\n**👥 Participants:** {participants} players\\n**📊 Total Deliveries:** {total} items"
    color: "#FFD700"
    footer: "SwiftDelivery | Delivery Event System"
    thumbnail: ""
    winners:
      title: "🏆 Winners"
      format: "{medal} **{player}** - {count} deliveries"
      medals:
        first: "🥇"
        second: "🥈"
        third: "🥉"
        other: "🔹"
      no-winners: "*No participants*"
      max-display: 5

  # Deliveries Cosmetics
  cosmetics:
    # Sound when a player delivers an item
    delivery-sound: "ENTITY_PLAYER_LEVELUP"
    # Particle effect around the player when delivering
    delivery-particle: "VILLAGER_HAPPY"
    # Action bar message
    delivery-action-bar: "<green><bold>SUCCESS!</bold></green> <gray>Item Delivered.</gray>"

    # Sound when a player sends P2P mail
    mail-send-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    mail-send-particle: "HEART"

# ┌───────────────────────────────────────────────┐
# │  DATABASE CONNECTION                          │
# │                                               │
# │  Controls how event data and leaderboards     │
# │  are stored across your server/network.       │
# └───────────────────────────────────────────────┘

database:

  # Database Engine
  # sqlite -> Recommended for single servers (stores in plugins/SwiftDelivery/data.db)
  # mysql  -> Required for BungeeCord/Velocity networks to sync data across servers
  type: sqlite

  # MySQL connection settings
  # Only used if type is set to "mysql"
  mysql:
    host: localhost
    port: 3306
    database: swiftdelivery
    username: root
    password: ""
    use-ssl: false
    # Maximum number of concurrent connections (HikariCP)
    pool-size: 10

# ┌───────────────────────────────────────────────┐
# │  NPC SETTINGS                                 │
# │                                               │
# │  Ids or Names of NPCs that open the menu      │
# │  when clicked (Citizens/FancyNpcs).           │
# └───────────────────────────────────────────────┘

npc-ids:
  - "1"
  - "DeliveryNPC"
