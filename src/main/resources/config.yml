# ===================================================================
#
#                       S w i f t D e l i v e r y
#               Premium Delivery Event System by NettyForge
#                            Version: 1.0.0
#
# ===================================================================

# ===================================================================
# GENERAL SETTINGS
# ===================================================================

general:
  # Locale file (locales folder: tr.yml, en.yml, de.yml, etc.)
  language: en

  # Timezone for scheduling
  timezone: Europe/Istanbul

  # Debug mode (detailed console logging)
  debug: false

# ===================================================================
# CATEGORY DISPLAY NAMES
# ===================================================================

category-display-names:
  farm: "Farm"
  ore: "Ore"
  block: "Block"
  food: "Food"
  wood: "Wood"
  rare: "Rare"
  nether: "Nether"
  end: "End"
  mob: "Mob Drop"
  dye: "Dye"
  tool: "Tool"
  armor: "Armor"
  combat: "Combat"
  potion: "Potion"
  decoration: "Decoration"
  redstone: "Redstone"
  misc: "Miscellaneous"

# ===================================================================
# DELIVERY DISPLAY NAMES
# ===================================================================

delivery-display-names:
  daily: "Daily Delivery"
  mining: "Mining Delivery"
  blocks: "Block Delivery"
  diamond: "Diamond Delivery"
  farming: "Farming Delivery"
  grand-event: "Grand Event"

# ===================================================================
# EVENT SETTINGS
# ===================================================================

events:
  # Maximum concurrent active events
  max-concurrent: 5

  # Announcements
  announcements:
    start: true
    end: true

  # Sounds
  sounds:
    enabled: true
    start: "ENTITY_PLAYER_LEVELUP"
    end: "UI_TOAST_CHALLENGE_COMPLETE"

  # Title display
  title:
    enabled: true
    fade-in: 10
    stay: 70
    fade-out: 20

# ===================================================================
# WEBHOOK (Discord)
# ===================================================================
#
# Discord webhook integration for automated event notifications.
#
# How to get a Webhook URL:
# 1. Choose a channel in your Discord server
# 2. Channel Settings > Integrations > Webhooks
# 3. Create a "New Webhook" and copy the URL
#
# ===================================================================

webhook:
  # Enable/disable webhook
  enabled: false

  # Discord Webhook URL (paste your Discord webhook URL here)
  url: "YOUR_WEBHOOK_URL_HERE"

  # Send @everyone mention (warning: may be spammy!)
  mention-everyone: false

  # --- Event Start Embed ---
  # Placeholders: {delivery}, {item}, {category}, {duration}, {winners}, {end_time}
  start:
    title: "📦 {delivery} Started!"
    description: "A new delivery event has started!\\n\\n**📋 Item to Deliver:**\\n`{item}`\\n\\n**📂 Category:** {category}\\n**⏰ Duration:** {duration}\\n**🏆 Winners:** {winners} players\\n\\n*Join the server and start delivering!*"
    color: "#00FF00"
    footer: "SwiftDelivery | Delivery Event System"
    thumbnail: ""
    author:
      name: "Delivery"
      icon: ""
    fields:
      - name: "How to Participate?"
        value: "Join the server and use `/delivery` to open the menu!"
        inline: false

  # --- Event End Embed ---
  # Placeholders: {delivery}, {item}, {category}, {total}, {participants}, {winners}
  end:
    title: "🏆 {delivery} Ended!"
    description: "The delivery event is complete!\\n\\n**📦 Delivered:** `{item}`\\n**📂 Category:** {category}\\n**👥 Participants:** {participants} players\\n**📊 Total Deliveries:** {total} items"
    color: "#FFD700"
    footer: "SwiftDelivery | Delivery Event System"
    thumbnail: ""
    winners:
      title: "🏆 Winners"
      format: "{medal} **{player}** - {count} deliveries"
      medals:
        first: "🥇"
        second: "🥈"
        third: "🥉"
        other: "🔹"
      no-winners: "*No participants*"
      max-display: 5

# ===================================================================
# DATA STORAGE
# ===================================================================

data:
  auto-save-interval: 5
  file: "data.yml"
