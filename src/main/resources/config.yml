  language: tr
  
  # Saat dilimi
  timezone: Europe/Istanbul
  
  # Debug modu (konsola detaylý log)
  debug: false

# ===============================================================================
# KATEGORÝ GÖRÜNEN ÝSÝMLERÝ
# ===============================================================================

category-display-names:
  farm: "Çiftlik"
  ore: "Maden"
  block: "Blok"
  food: "Yiyecek"
  wood: "Odun"
  rare: "Nadir"
  nether: "Nether"
  end: "End"
  mob: "Mob Drop"
  dye: "Boya"
  tool: "Alet"
  armor: "Zýrh"
  combat: "Savaþ"
  potion: "Ýksir"
  decoration: "Dekorasyon"
  redstone: "Kýzýltaþ"
  misc: "Çeþitli"

# ===============================================================================
# TESLÝMAT GÖRÜNEN ÝSÝMLERÝ
# ===============================================================================

delivery-display-names:
  gunluk: "Günlük Teslimat"
  maden: "Maden Teslimatý"
  blok: "Blok Teslimatý"
  elmas: "Elmas Teslimatý"
  ciftlik: "Çiftlik Teslimatý"
  buyuk-etkinlik: "Büyük Etkinlik"

# ===============================================================================
# ETKÝNLÝK AYARLARI
# ===============================================================================

events:
  # Ayný anda maksimum aktif etkinlik
  max-concurrent: 5
  
  # Duyurular
  announcements:
    start: true
    end: true
  
  # Sesler
  sounds:
    enabled: true
    start: "ENTITY_PLAYER_LEVELUP"
    end: "UI_TOAST_CHALLENGE_COMPLETE"
  
  # Title gösterimi
  title:
    enabled: true
    fade-in: 10
    stay: 70
    fade-out: 20

# ===============================================================================
# WEBHOOK (Discord)
# ===============================================================================
# 
# Discord webhook entegrasyonu ile etkinlik baþlangýç ve bitiþ bildirimlerini
# Discord sunucunuza otomatik olarak gönderin.
#
# Webhook URL nasýl alýnýr:
# 1. Discord sunucunuzda bir kanal seçin
# 2. Kanal Ayarlarý > Entegrasyonlar > Webhooks
# 3. "Yeni Webhook" oluþturun ve URL'yi kopyalayýn
#
# ===============================================================================

webhook:
  # Webhook'u aktif/pasif yap
  enabled: true
  
  # Discord Webhook URL'si (buraya Discord webhook URL'nizi yapýþtýrýn)
  url: "YOUR_WEBHOOK_URL_HERE"
  
  # @everyone mention'ý gönder (dikkat: spam olabilir!)
  mention-everyone: false
  
  # ¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦
  # ETKÝNLÝK BAÞLANGIÇ EMBED'Ý
  # ¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦
  # Placeholders:
  #   {delivery}    - Teslimat adý
  #   {item}        - Ýstenen eþya
  #   {category}    - Kategori adý
  #   {duration}    - Süre
  #   {winners}     - Kazanan sayýsý
  #   {end_time}    - Bitiþ zamaný
  # ¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦
  start:
    # Embed baþlýðý
    title: "?? {delivery} Baþladý!"
    
    # Embed açýklamasý (\\n ile yeni satýr)
    description: "Yeni bir teslimat etkinliði baþladý!\\n\\n**?? Teslim Edilecek Eþya:**\\n`{item}`\\n\\n**?? Kategori:** {category}\\n**?? Süre:** {duration}\\n**?? Kazanan Sayýsý:** {winners} kiþi\\n\\n*Hemen sunucuya gir ve teslimata baþla!*"
    
    # Embed rengi (hex: #00FF00 veya decimal: 65280)
    color: "#00FF00"
    
    # Footer metni
    footer: "VeloDelivery • Teslimat Etkinlik Sistemi"
    
    # Thumbnail resmi (URL veya boþ býrak)
    thumbnail: ""
    
    # Author bilgisi
    author:
      name: "Teslimat" # (sunucu isminiz)
      icon: ""
    
    # Ek alanlar (fields)
    fields:
      - name: "Nasýl Katýlýrým?"
        value: "Sunucuya gir ve `/teslimat` komutu ile menüyü aç!"
        inline: false
  
  # ¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦
  # ETKÝNLÝK BÝTÝÞ EMBED'Ý
  # ¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦
  # Placeholders:
  #   {delivery}    - Teslimat adý
  #   {item}        - Teslim edilen eþya
  #   {category}    - Kategori adý
  #   {total}       - Toplam teslimat sayýsý
  #   {participants}- Katýlýmcý sayýsý
  #   {winners}     - Kazananlar listesi (otomatik oluþturulur)
  # ¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦¦
  end:
    # Embed baþlýðý
    title: "?? {delivery} Sona Erdi!"
    
    # Embed açýklamasý
    description: "Teslimat etkinliði tamamlandý!\\n\\n**?? Teslim Edilen:** `{item}`\\n**?? Kategori:** {category}\\n**?? Katýlýmcý:** {participants} kiþi\\n**?? Toplam Teslimat:** {total} adet"
    
    # Embed rengi
    color: "#FFD700"
    
    # Footer metni
    footer: "VeloDelivery • Teslimat Sistemi"
    
    # Thumbnail resmi
    thumbnail: ""
    
    # Kazananlar bölümü
    winners:
      # Kazananlar baþlýðý
      title: "??? Kazananlar"
      
      # Kazanan formatý ({rank}, {player}, {count} kullanýlabilir)
      format: "{medal} **{player}** - {count} teslimat"
      
      # Madalya sembolleri
      medals:
        first: "??"
