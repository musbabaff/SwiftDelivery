# ┌─────────────────────────────────────────────────────────────────────────────┐
# │                                                                             │
# │                    SwiftDelivery — Item Definitions                         │
# │                                                                             │
# │  IMPORTANT NOTE FOR VANILLA ITEMS:                                          │
# │  You only need to define items here if you want to explicitly overwrite     │
# │  their Vanilla Minecraft name with a CUSTOM display name (e.g., "Magic      │
# │  Sword" instead of "Diamond Sword").                                        │
# │                                                                             │
# │  For all standard Minecraft items, simply LEAVE THEM OUT OF THIS FILE!      │
# │  SwiftDelivery will automatically use native Vanilla item translation,      │
# │  meaning the item name will automatically match the language currently      │
# │  selected in the player's own Minecraft client settings!                    │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

items:

  # ── CUSTOM ITEM EXAMPLES ──────────────────────────────────────────────────────
  
  # A custom stick with a special glowing name
  MAGIC_WAND:
    material: STICK
    display-name: "&#FF00FF✨ Magic Wand ✨"

  # A legally-questionable food item
  SUSPICIOUS_MUSHROOM:
    material: RED_MUSHROOM
    display-name: "&cDanger Shroom"

  # If you want to rename a specific diamond
  MY_SPECIAL_DIAMOND:
    material: DIAMOND
    display-name: "&bThe Chief Architect's Diamond"

  # ────────────────────────────────────────────────────────────────────────────
  # NOTE: As part of the SwiftDelivery architecture overhaul, over 2,600 lines
  # of redundant vanilla item names and unused prices have been completely 
  # eradicated from this file to ensure zero latency and full compatibility 
  # with all international clients out of the box.
  # ────────────────────────────────────────────────────────────────────────────
