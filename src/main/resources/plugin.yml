# ===================================================================
#                         SwiftDelivery
#            Premium Delivery Event System by NettyForge
# ===================================================================

name: SwiftDelivery
version: ${project.version}
main: com.nettyforge.swiftdelivery.SwiftDeliveryPlugin
api-version: '1.16'
authors:
  - NettyForge
  - musbabaff
description: |
  Premium delivery event automation plugin for Minecraft servers.
  Compatible with 1.16.5+ all versions.
website: https://github.com/musbabaff/SwiftDelivery
softdepend:
  - PlaceholderAPI
  - Vault
  - HolographicDisplays
  - DecentHolograms

# ===================================================================
# COMMANDS
# ===================================================================

commands:
  swiftdelivery:
    description: SwiftDelivery admin commands
    usage: /<command> <help|reload|list|start|stop|status>
    aliases: [sd, dc]
    permission: swiftdelivery.admin

  delivery:
    description: Opens the delivery menu
    usage: /<command> [info|top]
    aliases: [deliver, deliverymenu, dm, teslimat, tm]
    permission: swiftdelivery.use

  deliver:
    description: Quickly delivers items from inventory or chest
    usage: /<command> [category|chest]
    aliases: [del, teslim]
    permission: swiftdelivery.deliver

# ===================================================================
# PERMISSIONS
# ===================================================================

permissions:
  # --- Root Permission ---
  swiftdelivery.*:
    description: All SwiftDelivery permissions
    default: op
    children:
      swiftdelivery.admin: true
      swiftdelivery.use: true
      swiftdelivery.deliver: true
      swiftdelivery.bypass: true

  # --- Admin Permissions ---
  swiftdelivery.admin:
    description: All admin permissions
    default: op
    children:
      swiftdelivery.admin.reload: true
      swiftdelivery.admin.start: true
      swiftdelivery.admin.stop: true
      swiftdelivery.admin.list: true
      swiftdelivery.admin.status: true

  swiftdelivery.admin.reload:
    description: Reload configuration files
    default: op

  swiftdelivery.admin.start:
    description: Start a delivery event
    default: op

  swiftdelivery.admin.stop:
    description: Stop a delivery event
    default: op

  swiftdelivery.admin.list:
    description: View delivery list
    default: op

  swiftdelivery.admin.status:
    description: View plugin status
    default: op

  # --- Player Permissions ---
  swiftdelivery.use:
    description: Open the delivery menu
    default: true

  swiftdelivery.deliver:
    description: Deliver items
    default: true

  swiftdelivery.deliver.auto:
    description: Use automatic delivery
    default: true

  swiftdelivery.deliver.chest:
    description: Use chest delivery
    default: true

  # --- Bypass Permissions ---
  swiftdelivery.bypass:
    description: All bypass permissions
    default: op
    children:
      swiftdelivery.bypass.cooldown: true
      swiftdelivery.bypass.limit: true

  swiftdelivery.bypass.cooldown:
    description: Bypass cooldown timer
    default: op

  swiftdelivery.bypass.limit:
    description: Bypass delivery limit
    default: op
