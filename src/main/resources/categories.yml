# ┌─────────────────────────────────────────────────────────────────────────────┐
# │                                                                             │
# │                     SwiftDelivery — Category Definitions                    │
# │                                                                             │
# │  Define the item categories used in delivery events. Each category          │
# │  contains a list of items and their sell prices (Vault economy).            │
# │                                                                             │
# │  STRUCTURE:                                                                 │
# │    categories:                                                              │
# │      category_name:                                                         │
# │        items:                                                               │
# │          ITEM_NAME: price    # Sell price (Vault economy)                   │
# │                                                                             │
# │  NOTES:                                                                     │
# │    - Price of 0 means no payment for that item                              │
# │    - Item names must be valid Minecraft material IDs                        │
# │    - Example: DIAMOND, IRON_INGOT, WHEAT                                   │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

categories:

  # ┌───────────────────────────────────────────────┐
  # │  BLOCKS                                        │
  # │  Building materials and construction blocks    │
