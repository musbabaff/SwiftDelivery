# ┌─────────────────────────────────────────────────────────────────────────────┐
# │                                                                             │
# │                    SwiftDelivery — Delivery Definitions                     │
# │                                                                             │
# │  This file defines all delivery events, their schedules, rewards,          │
# │  and behavior. Each delivery is a timed event where players compete        │
# │  to deliver specific items for rankings and rewards.                       │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  CATEGORY & ITEM SELECTION                                                  │
# │                                                                             │
# │  category:                                                                  │
# │    mode: random         → Pick a random category                            │
# │    mode: fixed          → Use a specific category                           │
# │      value: block       → Category name (from categories.yml)               │
# │                                                                             │
# │  item:                                                                      │
# │    mode: random         → Pick a random item from the category              │
# │    mode: fixed          → Use a specific item                               │
# │      value: DIAMOND     → Minecraft item ID                                 │
# │                                                                             │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │  SCHEDULING                                                                 │
# │                                                                             │
# │  schedule:                                                                  │
# │    start: "every day 20:00"       → Start every day at 20:00                │
# │    end:   "every day 21:00"       → End every day at 21:00                  │
# │    start: "every friday 19:00"    → Start every Friday at 19:00             │
# │    start: "every saturday 18:00"  → Start every Saturday at 18:00           │
# │                                                                             │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │  REWARDS                                                                    │
# │                                                                             │
# │  Reward types: "item", "command", "both"                                    │
# │  Rank ranges: "1", "2", "3", "4-10", "11-25", "default"                    │
# │  Placeholder: {player} = winner's name, {rank} = winner's rank             │
# │                                                                             │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │  WEBHOOK (per-delivery override)                                            │
# │                                                                             │
# │  webhook:                                                                   │
# │    enabled: true/false  → Enable webhook for this delivery                  │
# │    url: ""              → Empty = use global URL from config.yml             │
# │                         → Set a URL to send to a different channel           │
# │                                                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

deliveries:

  # ┌───────────────────────────────────────────────┐
  # │  DAILY DELIVERY                                │
  # │  Every day at 20:00 — Random item, 1 hour      │
  # └───────────────────────────────────────────────┘

  daily:
    enabled: true
    display-name: "Daily Delivery"
    visible-before-start: true

    category:
      mode: random
    item:
      mode: random

    timezone: Europe/Istanbul

    schedule:
      start: "every day 20:00"
      end: "every day 21:00"

    # Allow players to sell delivered items for money (requires Vault)
    sellable:
      enabled: true
      tax-rate: 0.0            # 0.0 = no tax, 0.1 = 10% tax

    # Commands to run when the event ends (for all participants)
    end-commands:
      enabled: false
      commands:
        - "cc give {player} vote 1"

    # Rewards by rank position
    rewards:
      1:
        type: both             # "item" | "command" | "both"
        item: DIAMOND
        amount: 10
        commands:
          - "eco give {player} 5000"
          - "broadcast &6&l1. &e{player} &7won the daily delivery!"
      2:
        type: both
        item: DIAMOND
        amount: 5
        commands:
          - "eco give {player} 2500"
      3:
        type: item
        item: DIAMOND
        amount: 3
      4-10:
        type: command
        commands:
          - "eco give {player} 500"
      default:                 # All other participants
        type: command
        commands:
          - "eco give {player} 100"

    webhook:
      enabled: true
      url: ""                  # Empty = use global webhook from config.yml

  # ┌───────────────────────────────────────────────┐
  # │  MINING DELIVERY                               │
  # │  Every Saturday at 18:00 — Ore category         │
  # └───────────────────────────────────────────────┘

  mining:
    enabled: true
    display-name: "Mining Delivery"
    visible-before-start: true

    category:
      mode: fixed
      value: ore
    item:
      mode: random

    timezone: Europe/Istanbul

    schedule:
      start: "every saturday 18:00"
      end: "every saturday 20:00"

    sellable:
      enabled: true
      tax-rate: 0.0

    end-commands:
      enabled: false
      commands: []

    rewards:
      1:
        type: command
        commands:
          - "eco give {player} 10000"
      2:
        type: command
        commands:
          - "eco give {player} 5000"
      3:
        type: command
        commands:
          - "eco give {player} 2500"
      4-5:
        type: command
        commands:
          - "eco give {player} 1000"

    webhook:
      enabled: true
      url: ""

  # ┌───────────────────────────────────────────────┐
  # │  BLOCK DELIVERY                                │
  # │  Every Sunday at 14:00 — Block category         │
  # └───────────────────────────────────────────────┘

  blocks:
    enabled: true
    display-name: "Block Delivery"
    visible-before-start: true

    category:
      mode: fixed
      value: block
    item:
      mode: random

    timezone: Europe/Istanbul

    schedule:
      start: "every sunday 14:00"
      end: "every sunday 16:00"

    sellable:
      enabled: true
      tax-rate: 0.05           # 5% tax on block deliveries

    end-commands:
      enabled: false
      commands: []

    rewards:
      1:
        type: item
        item: DIAMOND
        amount: 5
      2:
        type: item
        item: DIAMOND
        amount: 3
      3:
        type: item
        item: DIAMOND
        amount: 1

    webhook:
      enabled: true
      url: ""

  # ┌───────────────────────────────────────────────┐
  # │  DIAMOND DELIVERY                              │
  # │  Every Friday at 19:00 — Fixed diamond item     │
  # └───────────────────────────────────────────────┘

  diamond:
    enabled: true
    display-name: "Diamond Delivery"
    visible-before-start: true

    category:
      mode: fixed
      value: ore
    item:
      mode: fixed
      value: DIAMOND

    timezone: Europe/Istanbul

    schedule:
      start: "every friday 19:00"
      end: "every friday 21:00"

    sellable:
      enabled: true
      tax-rate: 0.20           # 20% luxury tax

    end-commands:
      enabled: true
      commands:
        - "cc give {player} diamond_delivery 1"

    rewards:
      1:
        type: both
        item: EMERALD
        amount: 32
        commands:
          - "eco give {player} 10000"
      2:
        type: both
        item: EMERALD
        amount: 16
        commands:
          - "eco give {player} 5000"
      3:
        type: both
        item: EMERALD
        amount: 8
        commands:
          - "eco give {player} 2500"
      4-10:
        type: command
        commands:
          - "eco give {player} 1000"
      default:
        type: command
        commands:
          - "eco give {player} 100"

    webhook:
      enabled: true
      url: ""

  # ┌───────────────────────────────────────────────┐
  # │  FARMING DELIVERY                              │
  # │  Every Wednesday at 21:00 — Farm category       │
  # └───────────────────────────────────────────────┘

  farming:
    enabled: true
    display-name: "Farming Delivery"
    visible-before-start: true

    category:
      mode: fixed
      value: farm
    item:
      mode: random

    timezone: Europe/Istanbul

    schedule:
      start: "every wednesday 21:00"
      end: "every wednesday 22:00"

    sellable:
      enabled: true
      tax-rate: 0.05

    end-commands:
      enabled: false
      commands: []

    rewards:
      1:
        type: item
        item: GOLDEN_CARROT
        amount: 64
      2:
        type: item
        item: GOLDEN_CARROT
        amount: 32
      3:
        type: item
        item: GOLDEN_CARROT
        amount: 16

    webhook:
      enabled: true
      url: ""

  # ┌───────────────────────────────────────────────┐
  # │  GRAND EVENT                                   │
  # │  Every Saturday at 20:00 — 3-hour marathon      │
  # │  Massive rewards, custom webhook channel        │
  # └───────────────────────────────────────────────┘

  grand-event:
    enabled: true
    display-name: "Grand Event"
    visible-before-start: true

    category:
      mode: random
    item:
      mode: random

    timezone: Europe/Istanbul

    schedule:
      start: "every saturday 20:00"
      end: "every saturday 23:00"

    sellable:
      enabled: true
      tax-rate: 0.15           # 15% luxury tax

    end-commands:
      enabled: true
      commands:
        - "cc give {player} grand_event 1"
        - "cc give {player} rank_{rank} 1"

    rewards:
      1:
        type: both
        item: NETHERITE_INGOT
        amount: 5
        commands:
          - "eco give {player} 50000"
          - "broadcast &6&l🏆 &e{player} &7won the Grand Event!"
      2:
        type: both
        item: NETHERITE_INGOT
        amount: 3
        commands:
          - "eco give {player} 25000"
      3:
        type: both
        item: NETHERITE_INGOT
        amount: 1
        commands:
          - "eco give {player} 10000"
      4-10:
        type: command
        commands:
          - "eco give {player} 5000"
      11-25:
        type: command
        commands:
          - "eco give {player} 2500"
      26-50:
        type: command
        commands:
          - "eco give {player} 1000"
      51-100:
        type: command
        commands:
          - "eco give {player} 500"
      default:
        type: command
        commands:
          - "eco give {player} 100"

    # Custom webhook URL — sends to a different Discord channel
    webhook:
      enabled: true
      url: ""                  # Set a different URL here, or leave empty for global
